name: lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tooling
        run: |
          pip install ruff pylint pylint-odoo
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pylint-odoo
        run: |
          for mod in alfa_*; do
            if [ -d "$mod" ]; then
              pylint --rcfile=pyproject.toml "$mod" || true
            fi
          done
