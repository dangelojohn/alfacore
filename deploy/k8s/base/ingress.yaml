apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alfacore
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - alfacore.example.tld    # overridden by overlay
      secretName: alfacore-tls
  rules:
    - host: alfacore.example.tld   # overridden by overlay
      http:
        paths:
          - path: /longpolling
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8072
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8069
