apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base resources for an AlfaCore deployment. Overlays in deploy/k8s/overlays/
# patch this with env-specific config (replica count, ingress hostnames,
# resource limits, secrets references, release tag pointers).

resources:
  - namespace.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - odoo-deployment.yaml
  - odoo-service.yaml
  - odoo-configmap.yaml
  - odoo-pvc.yaml
  - ingress.yaml

# The cosign public key ConfigMap is generated from the alfacore.cosign.pub
# file at the repo root. Kustomize re-generates it on every build, so
# rotating the key is just: replace the file, commit, push. Argo CD applies.
configMapGenerator:
  - name: alfacore-cosign-pubkey
    files:
      - alfacore.cosign.pub=../../../alfacore.cosign.pub
    options:
      disableNameSuffixHash: true

commonLabels:
  app.kubernetes.io/name: alfacore
  app.kubernetes.io/part-of: realpartners
  realpartners.tld/customer: alfacore
