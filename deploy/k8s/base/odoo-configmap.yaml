apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
data:
  odoo.conf: |
    [options]
    addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    data_dir = /var/lib/odoo
    db_host = postgres
    db_port = 5432
    db_user = odoo
    db_password = $POSTGRES_PASSWORD
    dbfilter = ^alfacore.*
    list_db = False
    proxy_mode = True
    workers = 2
    max_cron_threads = 1
    limit_time_cpu = 600
    limit_time_real = 1200
    limit_memory_hard = 2684354560
    limit_memory_soft = 2147483648
    log_level = info
