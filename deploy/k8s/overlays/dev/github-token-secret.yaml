# Dev-only secret. PRODUCTION USES EXTERNAL SECRET STORE.
# Used by the addon-loader init-container to authenticate against the
# private GitHub Releases API when fetching the signed module tarball.
#
# Generate the token at:
#   https://github.com/settings/personal-access-tokens/new
# Fine-grained, repository access = dangelojohn/alfacore only,
# permissions = Contents: Read.
#
# Override via `kubectl -n alfacore-dev create secret generic alfacore-github-token \
#   --from-literal=token=ghp_xxxxx --dry-run=client -o yaml | kubectl apply -f -`
apiVersion: v1
kind: Secret
metadata:
  name: alfacore-github-token
type: Opaque
stringData:
  token: ghp_CHANGE_ME_BEFORE_FIRST_DEPLOY
