apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay for John's k3d/OrbStack cluster on the i9 iMac (72 GB RAM).
# Single-replica, smaller resources, no TLS, in-cluster Postgres password
# is a plain secret (not external secret store) — fine for dev.
#
# Dev typically deploys from a tagged pre-release (v0.x-rc*); update the
# addon-release ConfigMap below to point at the current dev release tag.

namespace: alfacore-dev

resources:
  - ../../base
  - postgres-secret.yaml
  - github-token-secret.yaml
  - addon-release-configmap.yaml

patches:
  - target:
      kind: Deployment
      name: odoo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
  - target:
      kind: Ingress
      name: alfacore
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: alfacore.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: alfacore.local
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer

configMapGenerator:
  - name: odoo-config
    behavior: replace
    files:
      - odoo.conf
