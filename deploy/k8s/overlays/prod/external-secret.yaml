# External Secrets Operator pulls Postgres credentials from the
# realpartners 1Password Connect store. Configure ClusterSecretStore
# 'realpartners-1password' on the cluster ahead of this.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alfacore-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: realpartners-1password
    kind: ClusterSecretStore
  target:
    name: alfacore-postgres
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: alfacore-prod-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: alfacore-prod-postgres
        property: password
