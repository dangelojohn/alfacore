# External Secrets Operator pulls the GitHub deploy token from the
# realpartners 1Password Connect store. Same store/operator pattern as
# the postgres credentials in external-secret.yaml.
#
# Expected 1Password item: 'alfacore-prod-github-token' with field 'token'.
# Token requirements: fine-grained PAT, repo dangelojohn/alfacore,
# Contents: Read (no other scopes needed — addon-loader only downloads
# Release assets, never writes).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alfacore-github-token
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: realpartners-1password
    kind: ClusterSecretStore
  target:
    name: alfacore-github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: alfacore-prod-github-token
        property: token
