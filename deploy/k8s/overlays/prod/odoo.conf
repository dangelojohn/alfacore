[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
db_host = postgres
db_port = 5432
# db_user / db_password are injected by the official Odoo image entrypoint
# from the USER / PASSWORD env vars (sourced from the alfacore-postgres
# Secret in odoo-deployment.yaml). CLI args take precedence over config
# file, so we deliberately do not set them here.
dbfilter = ^alfacore.*
list_db = False
proxy_mode = True
workers = 3
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
log_level = info
log_handler = :INFO
